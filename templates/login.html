<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — 피팅컷 생성기</title>
<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #0b0b0d; --surface: #141418; --surface-2: #1c1c22;
    --border: #2a2a32; --text: #f2f2f4; --muted: #8b8b96;
    --accent: #d4ff3f; --danger: #ff5c5c;
  }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    line-height: 1.6; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .box { width: 100%; max-width: 400px; }
  .eyebrow {
    font-size: 0.72rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--accent); font-weight: 700; margin-bottom: 10px;
  }
  h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 28px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 18px; padding: 24px;
  }
  label {
    display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 8px;
  }
  input {
    width: 100%; padding: 13px 14px; margin-bottom: 18px;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 11px;
    font-size: 0.95rem; font-family: inherit;
  }
  input:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(212,255,63,.13);
  }
  button {
    width: 100%; padding: 15px; background: var(--accent); color: #14140a;
    border: none; border-radius: 13px; font-size: 0.98rem; font-weight: 800;
    font-family: inherit; cursor: pointer; transition: background .15s;
  }
  button:hover { background: #e2ff60; }
  .error {
    color: var(--danger); font-size: 0.85rem; margin: 0 0 16px;
    padding: 11px 14px; background: rgba(255,92,92,.08);
    border: 1px solid rgba(255,92,92,.25); border-radius: 10px;
  }
  .hint { color: var(--muted); font-size: 0.76rem; margin-top: 14px; }
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">AI Shop Tools</div>
  <h1>피팅컷 생성기</h1>
  <p class="sub">추천인 코드를 받은 분만 이용할 수 있어요.</p>
  <form class="card" method="post">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <label for="code">추천인 코드</label>
    <input type="password" id="code" name="code" placeholder="코드를 입력하세요" required autocomplete="off">
    <label for="shop">상호명 (내 쇼핑몰 이름)</label>
    <input type="text" id="shop" name="shop" placeholder="예: 그루밍 스토어" required maxlength="40">
    <button type="submit">입장하기</button>
    <p class="hint">상호명은 화면 표시에만 쓰이고, 사진과 API 키는 저장되지 않습니다.</p>
  </form>
</div>
</body>
</html>
