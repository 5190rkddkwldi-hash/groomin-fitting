<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>배경 스타일 생성기</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  .hint { color: #888; font-size: 0.85rem; }
  fieldset { border: 1px solid #ccc; border-radius: 8px; margin-bottom: 16px; padding: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 4px; }
  input[type="file"], input[type="password"], input[type="number"], select {
    width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 12px;
    border: 1px solid #ccc; border-radius: 6px; font-size: 1rem;
  }
  button {
    padding: 10px 20px; font-size: 1rem; border: none; border-radius: 6px;
    background: #2563eb; color: white; cursor: pointer;
  }
  button:disabled { background: #93b4f0; cursor: not-allowed; }
  #status { margin: 16px 0; min-height: 1.5em; }
  #status.error { color: #dc2626; }
  #promptBox { background: #f3f4f6; padding: 12px; border-radius: 6px; margin-bottom: 16px; font-size: 0.9rem; white-space: pre-wrap; }
  #results { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  #results figure { margin: 0; }
  #results img { width: 100%; border-radius: 8px; display: block; }
  #results figcaption { text-align: center; margin-top: 6px; }
  #results a { font-size: 0.85rem; }
</style>
</head>
<body>
  <h1>배경 스타일 생성기</h1>
  <p class="hint">
    모델이 상품을 착용한 참고 사진을 올리면, 그 배경의 색감·조명·분위기를 분석해서
    비슷한 스타일의 새 배경 이미지를 AI로 생성합니다.
  </p>

  <form id="form">
    <fieldset>
      <label for="apiKey">Google AI Studio API 키</label>
      <input type="password" id="apiKey" name="api_key" placeholder="AIza..." required autocomplete="off">
      <p class="hint">이 서버는 입력하신 키를 저장하지 않습니다. 요청 처리 후 즉시 폐기됩니다. 키는 aistudio.google.com 에서 발급받을 수 있습니다.</p>

      <label for="image">참고 사진</label>
      <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/webp" required>

      <label for="count">생성할 배경 개수</label>
      <input type="number" id="count" name="count" min="1" max="{{ max_count }}" value="3">
    </fieldset>

    <button type="submit" id="submitBtn">배경 생성하기</button>
  </form>

  <div id="status"></div>
  <div id="promptBox" hidden></div>
  <div id="results"></div>

<script>
const form = document.getElementById("form");
const statusEl = document.getElementById("status");
const promptBox = document.getElementById("promptBox");
const resultsEl = document.getElementById("results");
const submitBtn = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  statusEl.className = "";
  statusEl.textContent = "처리 중입니다... (개수에 따라 최대 2분 정도 걸릴 수 있어요)";
  promptBox.hidden = true;
  resultsEl.innerHTML = "";
  submitBtn.disabled = true;

  try {
    const resp = await fetch("/api/process", {
      method: "POST",
      body: new FormData(form),
    });
    const data = await resp.json();

    if (!resp.ok) {
      throw new Error(data.error || "알 수 없는 오류가 발생했습니다.");
    }

    statusEl.textContent = `완료되었습니다. (${data.images.length}개 생성)`;
    promptBox.hidden = false;
    promptBox.textContent = "분석된 스타일: " + data.prompt;

    data.images.forEach((src, i) => {
      const fig = document.createElement("figure");
      const img = document.createElement("img");
      img.src = src;
      const caption = document.createElement("figcaption");
      const link = document.createElement("a");
      link.href = src;
      link.download = `background_${i + 1}.png`;
      link.textContent = "다운로드";
      caption.appendChild(link);
      fig.appendChild(img);
      fig.appendChild(caption);
      resultsEl.appendChild(fig);
    });
  } catch (err) {
    statusEl.className = "error";
    statusEl.textContent = "오류: " + err.message;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
